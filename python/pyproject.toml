[project]
name = "myown-llm-integrator"
version = "0.2.0"
description = "Local subscription-authenticated AI CLI inference engine"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["jsonschema>=4.18.0,<5", "referencing>=0.28.4,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["myown_llm_integrator"]
